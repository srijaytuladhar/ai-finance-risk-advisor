# Fintech Financial & Ledger Risk Advisor - Spring AI Backend Configuration

server.port=8000

# JSON serialization matching frontend schemas (snake_case)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Spring AI OpenAI configuration (Configured for OpenRouter by default, compatible with OpenAI & Ollama)
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:sk-or-v1-s256250fb461e86f168a47a501950c618a8512482274f9647ea2e5e4bca859be31dultra}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.0

# CORS settings
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.fonepay.riskadvisor=INFO
logging.level.org.springframework.ai=INFO
